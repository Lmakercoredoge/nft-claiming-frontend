<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { font-size: 2.5rem; }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stat-icon { font-size: 3rem; }
        .stat-value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        th { font-weight: 600; background: rgba(255, 255, 255, 0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        .tab.active { background: rgba(255, 255, 255, 0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="totalClaims">-</div>
                <div>총 클레임</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="uniqueWallets">-</div>
                <div>고유 지갑</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💸</div>
                <div class="stat-value" id="totalAmount">-</div>
                <div>총 지급량</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('claims')">📜 클레임 내역</button>
            <button class="tab" onclick="switchTab('whitelist')">✅ 화이트리스트</button>
        </div>

        <div id="claims" class="section tab-content active">
            <h2>📜 최근 클레임 내역</h2>
            <div id="claimsList">로딩중...</div>
        </div>

        <div id="whitelist" class="section tab-content">
            <h2>✅ 화이트리스트 관리</h2>
            <input type="text" id="address" placeholder="지갑 주소">
            <input type="text" id="note" placeholder="메모">
            <button class="button" onclick="addWhitelist()">추가</button>
            <div id="whitelistList">로딩중...</div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000/api/admin';
        const token = localStorage.getItem('adminToken');

        if (!token) {
            window.location.href = '/admin.html';
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        async function apiCall(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    ...options.headers,
                    'Authorization': `Bearer ${token}`
                }
            });
            if (res.status === 401) {
                logout();
            }
            return res;
        }

        async function loadStats() {
            const res = await apiCall(`${API}/stats`);
            const {stats} = await res.json();
            document.getElementById('totalClaims').textContent = stats?.totalClaims || 0;
            document.getElementById('uniqueWallets').textContent = stats?.uniqueWallets || 0;
            document.getElementById('totalAmount').textContent = (stats?.totalAmount || 0).toLocaleString();
        }

        async function loadClaims() {
            const res = await apiCall(`${API}/recent-claims`);
            const {claims} = await res.json();
            document.getElementById('claimsList').innerHTML = claims?.length ? 
                '<table><tr><th>지갑</th><th>NFT</th><th>금액</th><th>시간</th></tr>' +
                claims.map(c => `<tr><td>${c.wallet_address?.slice(0,8)}...</td><td>${c.nft_count}</td><td>${c.amount?.toLocaleString()}</td><td>${new Date(c.timestamp).toLocaleString()}</td></tr>`).join('') +
                '</table>' : '클레임 내역 없음';
        }

        async function loadWhitelist() {
            const res = await apiCall(`${API}/whitelist`);
            const {whitelist} = await res.json();
            document.getElementById('whitelistList').innerHTML = whitelist?.length ?
                '<table><tr><th>주소</th><th>메모</th><th>추가일</th></tr>' +
                whitelist.map(w => `<tr><td>${w.address?.slice(0,12)}...</td><td>${w.note||''}</td><td>${new Date(w.added_at).toLocaleDateString()}</td></tr>`).join('') +
                '</table>' : '화이트리스트 없음';
        }

        async function addWhitelist() {
            const address = document.getElementById('address').value;
            const note = document.getElementById('note').value;
            await apiCall(`${API}/whitelist`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({address, note})
            });
            loadWhitelist();
        }

        window.onload = () => {
            loadStats();
            loadClaims();
            loadWhitelist();
        };
    </script>
</body>
</html>
